<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b62"><title>Администрирование · Проверка сотрудников</title><link rel="stylesheet" href="./assets/css/app.css"><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script></head>
<body><header><a class="brand" href="./admin.html">PASS / CONTROL</a><div class="head-actions"><a class="button secondary" href="./log.html" data-i18n="logs"></a><select id="language" class="lang-switch"><option value="ru">RU</option><option value="uz">UZ</option></select><button id="logout" class="button ghost" data-i18n="logout"></button></div></header>
<main class="container"><div class="row between"><div><h1 data-i18n="employees"></h1><p>Сотрудники, допуски и договоры</p></div><button id="add-employee" class="button" data-i18n="add"></button></div><div id="notice" class="error" hidden></div>
<section class="card location-panel"><div class="row between"><div><h2 data-i18n="locations"></h2><p class="muted">Для каждой точки создаётся постоянный QR-плакат.</p></div></div><form id="location-form" class="row location-create"><label class="sr-only" for="location-name" data-i18n="location_name"></label><input id="location-name" name="name" required maxlength="120" data-i18n-placeholder="location_name"><button class="button" type="submit" data-i18n="add_location"></button></form><div id="location-list" class="location-list"></div></section>
<div class="toolbar"><input id="search" type="search" data-i18n-placeholder="search" aria-label="Поиск"><select id="status-filter"><option value="" data-i18n="all"></option><option value="active" data-i18n="active"></option><option value="suspended" data-i18n="suspended"></option><option value="fired" data-i18n="fired"></option></select><select id="department-filter"><option value="">Все отделы</option></select></div>
<div class="table-wrap"><table><thead><tr><th data-i18n="full_name"></th><th data-i18n="position"></th><th data-i18n="department"></th><th data-i18n="phone"></th><th>Статус</th><th data-i18n="valid_until"></th><th></th></tr></thead><tbody id="employee-list"></tbody></table><div id="empty" class="empty" hidden data-i18n="no_data"></div></div></main>
<div id="employee-modal" class="modal" hidden><section class="modal-card"><div class="row between"><h2 id="modal-title">Новый сотрудник</h2><button class="button ghost" data-close aria-label="Закрыть">×</button></div><div id="modal-notice" class="error" hidden></div><form id="employee-form" class="stack"><input type="hidden" name="id"><div class="grid grid-2"><div class="field"><label data-i18n="full_name"></label><input name="full_name" required maxlength="160"></div><div class="field"><label data-i18n="position"></label><input name="position" required maxlength="120"></div><div class="field"><label data-i18n="department"></label><input name="department" required maxlength="120"></div><div class="field"><label data-i18n="phone"></label><input name="phone" type="tel" autocomplete="tel" maxlength="40" placeholder="+998901234567"></div><div class="field"><label data-i18n="hire_date"></label><input name="hire_date" type="date" required></div><div class="field"><label data-i18n="valid_until"></label><input name="pass_valid_until" type="date" required></div><div class="field"><label>Статус</label><select name="status"><option value="active" data-i18n="active"></option><option value="suspended" data-i18n="suspended"></option><option value="fired" data-i18n="fired"></option></select></div><div class="field"><label data-i18n="photo"></label><input name="photo" type="file" accept="image/jpeg,image/png"></div></div>
<div id="pin-section" class="card pin-panel"><div class="field"><label for="employee-pin" data-i18n="pin"></label><input id="employee-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="new-password"><p class="small muted" data-i18n="pin_help"></p></div><button id="set-pin" type="button" class="button secondary" data-i18n="reset_pin"></button></div>
<div id="contract-section" class="card" hidden><h3 data-i18n="contracts"></h3><div id="contract-list" class="contract-list"></div><div class="grid grid-3" style="margin-top:14px"><div class="field"><label data-i18n="contract_number"></label><input name="contract_number" maxlength="80"></div><div class="field"><label data-i18n="contract_type"></label><input name="contract_type" maxlength="80"></div><div class="field"><label data-i18n="start_date"></label><input name="start_date" type="date"></div><div class="field"><label data-i18n="end_date"></label><input name="end_date" type="date"></div><div class="field"><label>Файл PDF/JPG/PNG</label><input name="contract_file" type="file" accept="application/pdf,image/jpeg,image/png"></div><div class="field" style="align-self:end"><button id="add-contract" type="button" class="button secondary" data-i18n="upload"></button></div></div><div id="contract-warning" class="notice" hidden></div></div><div class="row between"><span class="small muted">PIN передаётся в Supabase Auth и очищается после сохранения.</span><div class="row"><button type="button" class="button ghost" data-close data-i18n="cancel"></button><button type="submit" class="button" data-i18n="save"></button></div></div></form></section></div>
<script type="module" src="./assets/js/admin.js"></script></body></html>
