<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b62"><title>Проверка на входе</title><link rel="stylesheet" href="./assets/css/app.css"></head>
<body class="check-page"><header class="check-header"><a class="brand" href="./check.html" aria-label="PASS / CONTROL">PASS / CONTROL</a><div class="head-actions"><select id="language" class="lang-switch" aria-label="Язык"><option value="ru">RU</option><option value="uz">UZ</option></select><button id="logout" class="button ghost" data-i18n="logout"></button></div></header>
<main class="check-wrap"><section id="login-panel" class="auth-card"><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p><div id="notice" class="error" hidden></div><form id="employee-login" class="stack" autocomplete="on"><div class="field"><label for="phone" data-i18n="login_phone"></label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="username" required maxlength="20" placeholder="+998901234567"></div><div class="field"><label for="pin" data-i18n="login_pin"></label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required></div><button type="submit" class="button check-submit" data-i18n="login_employee"></button></form><p class="small muted" data-i18n="login_hint"></p></section>
<section id="result-panel" class="check-result" hidden aria-live="polite"><div id="result-card" class="check-card"><div class="live-row"><span class="live-badge"><i></i><span data-i18n="live"></span></span><time id="live-clock">--:--:--</time></div><div id="result-state" class="check-state">…</div><div class="live-strip" aria-hidden="true"><span></span></div><div class="employee-result"><img id="result-photo" alt="" hidden><div><h1 id="result-name"></h1><p id="result-position"></p></div></div><p id="result-location" class="muted"></p><p id="result-valid" class="small"></p><button id="try-again" class="button secondary" type="button" data-i18n="retry_check"></button></div></section>
<div id="location-error" class="error" hidden data-i18n="location_invalid"></div></main><script type="module" src="./assets/js/check.js"></script></body></html>
