<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b62"><title>Вход · QR-пропуска</title><link rel="stylesheet" href="./assets/css/app.css"></head>
<body><main class="auth-wrap"><section class="auth-card"><div class="row between"><a class="brand" href="./index.html">PASS / CONTROL</a><select id="language" class="lang-switch" aria-label="Язык"><option value="ru">RU</option><option value="uz">UZ</option></select></div><div style="height:22px"></div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p><div id="notice" class="error" hidden></div><form id="login-form" class="stack" autocomplete="on"><div class="field"><label for="email" data-i18n="email"></label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div><div class="field"><label for="password" data-i18n="password"></label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></div><button type="submit" class="button" data-i18n="login"></button></form><p class="small muted">Доступ выдаёт администратор системы.</p></section></main><script type="module">import {bindLogin} from './assets/js/common.js';bindLogin();</script></body></html>
